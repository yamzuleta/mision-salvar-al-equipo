<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Misión: Salvar al Equipo</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concepto: novela visual de oficina. Escena con retratos arriba, panel de diálogo debajo, indicadores fijos en la cabecera. */
:root{
  --bg:#eaf0ef; --surface:#ffffff; --surface-2:#f2f7f6; --ink:#16262b; --muted:#566a70; --line:#cddbda;
  --petrol:#1f5f6b; --petrol-2:#2e7683; --on-petrol:#ffffff;
  --sage:#7fa58f; --sage-soft:#deebe3;
  --good:#2a7650; --good-soft:#dcefe4; --bad:#a93f36; --bad-soft:#f6e3df; --mix:#80601a; --mix-soft:#f3e9cf;
  --scene-top:#e3eeed; --scene-bot:#d0e3df; --floor:#b9d1ca;
  --m1:#1f5f6b; --m2:#4a93a0; --m3:#7fa58f; --m4:#2f4852;
  --shadow:0 1px 2px rgba(22,38,43,.06),0 10px 28px rgba(22,38,43,.07);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e191c; --surface:#152427; --surface-2:#1b2e32; --ink:#e5eef0; --muted:#9bb0b6; --line:#28393d;
    --petrol:#5fb0be; --petrol-2:#7cc3cf; --on-petrol:#0b1d21;
    --sage:#86ad97; --sage-soft:#1f342b;
    --good:#74d3a0; --good-soft:#17332a; --bad:#f19083; --bad-soft:#3a211e; --mix:#e5c577; --mix-soft:#36301c;
    --scene-top:#17303a; --scene-bot:#1b3a40; --floor:#102226;
    --m1:#5fb0be; --m2:#8cc6d0; --m3:#8fbca0; --m4:#d3e4e8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e191c; --surface:#152427; --surface-2:#1b2e32; --ink:#e5eef0; --muted:#9bb0b6; --line:#28393d;
  --petrol:#5fb0be; --petrol-2:#7cc3cf; --on-petrol:#0b1d21;
  --sage:#86ad97; --sage-soft:#1f342b;
  --good:#74d3a0; --good-soft:#17332a; --bad:#f19083; --bad-soft:#3a211e; --mix:#e5c577; --mix-soft:#36301c;
  --scene-top:#17303a; --scene-bot:#1b3a40; --floor:#102226;
  --m1:#5fb0be; --m2:#8cc6d0; --m3:#8fbca0; --m4:#d3e4e8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.12}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}

/* Cabecera */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{padding-block:10px 12px;display:grid;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chapter-ind{min-width:0}
.chapter-ind .ci-top{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--petrol)}
.chapter-ind .ci-title{font-family:var(--f-display);font-weight:650;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:4px;margin-top:5px}
.segs i{height:4px;width:26px;border-radius:2px;background:var(--line)}
.segs i.done{background:var(--petrol)}
.segs i.now{background:var(--sage)}
.top-actions{display:flex;gap:8px;flex:none}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--petrol);border-radius:999px;padding:7px 13px;font-weight:600;font-size:.88rem;cursor:pointer;min-height:38px}
.chipbtn:hover{border-color:var(--petrol)}
.chipbtn.danger{color:var(--bad);border-color:var(--bad)}
.chipbtn.danger:hover{background:var(--bad-soft)}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}
.meter{min-width:0}
.meter-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:.8rem;font-weight:600}
.meter-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter-val{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.fill{height:100%;width:0;border-radius:5px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.delta{display:block;min-height:1.1em;font-size:.76rem;font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
@media (max-width:560px){.meters{grid-template-columns:repeat(2,1fr);gap:6px 14px}.delta{min-height:0;display:inline;margin-left:4px}.meter-head{justify-content:flex-start;gap:8px}.meter-val{margin-left:auto}.segs i{width:20px}}

/* Contenido */
main{padding-block:22px 36px;min-height:60vh}
.stage-in{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.stack{display:grid;gap:16px}
.btn{border:1.5px solid transparent;border-radius:12px;padding:12px 22px;font-weight:650;cursor:pointer;min-height:48px;transition:background .15s,border-color .15s,transform .15s}
.btn.primary{background:var(--petrol);color:var(--on-petrol)}
.btn.primary:hover{background:var(--petrol-2)}
.btn.ghost{background:transparent;color:var(--petrol);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--petrol)}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--petrol)}

/* Inicio */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start}
.hero h1{display:grid;gap:2px;margin:8px 0 14px}
.h1a{font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:var(--petrol);font-weight:700;font-family:var(--f-body)}
.h1b{font-size:clamp(2.5rem,8vw,4.3rem);font-weight:760;letter-spacing:-.025em;font-variation-settings:"opsz" 96;line-height:.98}
.lede{font-size:1.15rem;color:var(--muted);max-width:34ch}
.objective{margin:20px 0 14px;padding:18px 20px}
.objective h2{font-size:1.05rem;margin-bottom:6px}
.how{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.how li{padding-left:22px;position:relative}
.how li::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:3px;background:var(--sage)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:.88rem;color:var(--muted);margin-bottom:20px}
.legend span{display:flex;gap:8px;align-items:flex-start}
.legend i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:.45em}
.cta-row{display:flex;gap:10px;flex-wrap:wrap}
.fine{font-size:.82rem;color:var(--muted);margin-top:14px;max-width:56ch}
.hero-cast{display:grid;gap:10px}
.hero-cast h2{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body)}
.mini{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.mini svg,.mini img{width:64px;height:64px;border-radius:16px;display:block;object-fit:cover;object-position:center top}
.mini b{display:block;font-family:var(--f-display);font-size:1rem}
.mini small{display:block;color:var(--muted);line-height:1.35;font-size:.82rem}
@media (max-width:760px){.hero{grid-template-columns:1fr}}


.profile-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.profile-pick{border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font:inherit}
.profile-pick img{width:100%;max-width:140px;aspect-ratio:1/1;object-fit:cover;object-position:center top;border-radius:12px}
.profile-pick.selected{border-color:var(--petrol);box-shadow:0 0 0 2px color-mix(in srgb,var(--petrol) 18%,transparent)}
.player-label{display:block;font-weight:700;margin:10px 0 6px}
.player-input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:12px 14px;font:inherit}

/* Escena */
.scene{background:linear-gradient(180deg,var(--scene-top),var(--scene-bot));border:1px solid var(--line);border-radius:18px;padding:14px 14px 0;overflow:hidden}
.place{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
.cast{display:flex;gap:10px;align-items:flex-end;padding-bottom:12px}
.pc{flex:1 1 0;min-width:0;max-width:128px;margin:0;text-align:center;transition:opacity .25s,transform .25s}
.pc svg,.pc img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;object-position:center top;border-radius:18%;transition:box-shadow .25s}
.pc.on{transform:translateY(-4px)}
.pc.on svg,.pc.on img{box-shadow:0 0 0 3px var(--petrol)}
.pc.dim{opacity:.6}
.pc figcaption{margin-top:6px;line-height:1.2}
.pc figcaption b{display:block;font-size:.88rem;font-family:var(--f-display)}
.pc figcaption span{display:none;font-size:.72rem;color:var(--muted)}
@media (min-width:640px){.pc figcaption span{display:block}}
.floor{height:10px;background:var(--floor);margin:0 -14px}

/* Diálogo */
.dlg{position:relative;margin-top:14px}
.tag{display:inline-flex;align-items:baseline;gap:8px;background:var(--petrol);color:var(--on-petrol);padding:5px 14px;border-radius:10px 10px 0 0;font-family:var(--f-display);font-weight:700;margin-left:16px}
.tag small{font-family:var(--f-body);font-weight:500;opacity:.85;font-size:.76rem}
.dlg-box{background:var(--surface);border:1.5px solid var(--petrol);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.line{font-size:1.1rem;line-height:1.55;min-height:3.4em}
.line.thought{font-style:italic;color:var(--muted)}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.prog{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Capítulo */
.chap h2{font-size:clamp(1.7rem,5vw,2.4rem);margin:6px 0 12px}
.goal{padding:12px 14px;border-radius:12px;background:var(--sage-soft);margin:14px 0 18px;font-size:.96rem}
.goal b{color:var(--petrol)}
.chap .intro{font-size:1.08rem;margin-bottom:18px;max-width:60ch}

/* Decisiones */
.situation{margin-top:14px;padding:18px 20px}
.situation p{font-size:1.04rem}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.02rem;line-height:1.45;transition:border-color .15s,transform .15s,box-shadow .15s}
.choice:hover{border-color:var(--petrol);transform:translateY(-1px);box-shadow:var(--shadow)}
.choice .key{flex:none;width:30px;height:30px;border-radius:9px;background:var(--sage-soft);color:var(--petrol);font-weight:800;display:grid;place-items:center;font-family:var(--f-display)}
.choice span.txt{min-width:0}

/* Módulos educativos */
.module{margin-top:14px;padding:18px 20px}
.module h3{font-size:1.1rem;margin-bottom:4px}
.module .sub{color:var(--muted);font-size:.92rem;margin-bottom:10px}
details.mth{border:1px solid var(--line);border-radius:12px;padding:0;margin-top:8px;background:var(--surface-2)}
details.mth summary{cursor:pointer;padding:12px 14px;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.mth summary::-webkit-details-marker{display:none}
details.mth summary::after{content:"+";font-weight:700;color:var(--petrol)}
details.mth[open] summary::after{content:"–"}
details.mth .body{padding:0 14px 14px;display:grid;gap:6px;font-size:.94rem}
.ex{padding:8px 10px;border-radius:10px;background:var(--surface);border:1px dashed var(--line)}
.pin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pin .who{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);font-size:.92rem;display:grid;gap:6px}
.pin .who b{font-family:var(--f-display);font-size:1rem}
.pin dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--petrol);font-weight:700}
.pin dd{margin:0}
@media (max-width:560px){.pin{grid-template-columns:1fr}}

/* Resultado */
.result{display:grid;gap:14px;margin-top:14px}
.result h3{font-size:1.2rem}
.q{display:inline-block;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em}
.q.good{background:var(--good-soft);color:var(--good)} .q.mixed{background:var(--mix-soft);color:var(--mix)} .q.poor{background:var(--bad-soft);color:var(--bad)}
.picked{color:var(--muted);font-size:.94rem;border-left:3px solid var(--line);padding-left:12px}
.deltas{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 11px;border-radius:999px;font-weight:650;font-size:.86rem;font-variant-numeric:tabular-nums}
.chip.up{background:var(--good-soft);color:var(--good)} .chip.down{background:var(--bad-soft);color:var(--bad)} .chip.zero{background:var(--surface-2);color:var(--muted)}
.feedback{background:var(--sage-soft);border-radius:14px;padding:14px 16px}
.feedback h4{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--petrol);font-family:var(--f-body);margin-bottom:4px}
.transition{color:var(--muted);font-style:italic}

/* Final */
.end h2{font-size:clamp(1.8rem,5.5vw,2.8rem);margin:8px 0 12px}
.end-badge{display:inline-block;padding:5px 12px;border-radius:999px;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.end-badge.favorable{background:var(--good-soft);color:var(--good)} .end-badge.fragil{background:var(--mix-soft);color:var(--mix)} .end-badge.aprendizaje{background:var(--bad-soft);color:var(--bad)}
.final-meters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.fm{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2)}
.fm b{display:block;font-size:1.7rem;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.fm span{font-size:.82rem;color:var(--muted)}
@media (max-width:560px){.final-meters{grid-template-columns:repeat(2,1fr)}}
.sum{display:grid;gap:10px;margin-top:10px}
.sum-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}
.sum-item .sh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.sum-item b{font-family:var(--f-display)}
.sum-item p{margin-top:6px;font-size:.95rem}
.sum-item details{margin-top:6px;font-size:.92rem;color:var(--muted)}
.sum-item summary{cursor:pointer;color:var(--petrol);font-weight:600}
.learn{display:grid;gap:8px;padding:0;margin:10px 0 0;list-style:none}
.learn li{padding-left:22px;position:relative;font-size:.96rem}
.learn li::before{content:"";position:absolute;left:2px;top:.6em;width:9px;height:9px;border-radius:3px;background:var(--petrol)}
.sec-h{font-size:1.2rem;margin:26px 0 4px}
.explore li{margin-bottom:6px}

/* Modales */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,22,26,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:rise .2s ease both}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;width:100%;max-width:740px;padding:22px;margin-block:auto;box-shadow:var(--shadow)}
.modal-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.modal-h h2{font-size:1.5rem}
.close{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:1.2rem;line-height:1;color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--petrol);color:var(--on-petrol);border-color:var(--petrol)}
.mcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--surface-2)}
.mcard h3{font-size:1.1rem;margin-bottom:2px}
.mcard .def{color:var(--muted);margin-bottom:8px}
.mcard dl{display:grid;gap:6px;margin:0;font-size:.93rem}
.mcard dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--petrol);font-weight:700}
.mcard dd{margin:0}
.note{font-size:.84rem;color:var(--muted);margin-top:8px}
.logi{border-left:3px solid var(--sage);padding:4px 0 4px 12px;margin-bottom:12px}
.logi b{font-family:var(--f-display)}
.logi p{font-size:.93rem;color:var(--muted)}
.foot{padding-block:8px 28px;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

<script>
(function(){

function buildMeters(){

       '<div class="bar" role="meter" aria-label="'+k.name+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="mb-'+k.k+'"><div class="fill" id="mf-'+k.k+'" style="background:'+k.color+'"></div></div>'+
       '<span class="delta" id="md-'+k.k+'"></span></div>';

function updateMeters(real){
  for(var i=0;i<KEYS.length;i++){
    var k=KEYS[i].k,v=S.stats[k];

    $("#mf-"+k).style.width=v+"%";

  for(var j=0;j<S.log.length;j++){
    var g=S.log[j];
    h+='<div class="sum-item"><div class="sh"><b>Capítulo '+(g.ch+1)+' · '+g.chTitle+'</b><span class="q '+g.q+'">'+QLABEL[g.q]+'</span></div><p>'+g.short+'. '+g.conseq+'</p><div class="deltas" style="margin-top:8px">'+chipsHTML(g.real)+'</div><details><summary>Por qué importa</summary><p>'+g.fb+'</p></details></div>';
  }
  h+='</div><h3 class="sec-h">Lo que practicaste</h3><ul class="learn">';
  for(var k=0;k<CONCEPTS.length;k++){h+='<li><b>'+CONCEPTS[k][0]+'.</b> '+CONCEPTS[k][1]+'</li>';}
  h+='<li><b>Negociación, mediación, conciliación y arbitraje.</b> Cada método tiene condiciones y límites; ninguno es mejor en todos los casos.</li></ul>';
  var ex="";
  for(var m=0;m<S.log.length;m++){if(S.log[m].q!=="good"){ex+='<li><b>Capítulo '+(S.log[m].ch+1)+'.</b> Elegiste «'+S.log[m].short.toLowerCase()+'». '+CH[S.log[m].ch].alt+'</li>';}}
  if(ex){h+='<h3 class="sec-h">Para explorar en otra partida</h3><ul class="learn explore">'+ex+'</ul>';}
  else{h+='<h3 class="sec-h">Para explorar en otra partida</h3><p>Tomaste decisiones sólidas en todos los capítulos. Prueba decisiones distintas para comparar cómo cambian las consecuencias en el mismo conflicto laboral.</p>';}
  h+='<h3 class="sec-h">Lleva lo aprendido a otros ámbitos</h3>'+
    '<p>La misión se desarrolla en un entorno laboral. Sin embargo, las habilidades de escucha, análisis de causas y construcción de acuerdos también pueden ayudar a abordar conflictos en otros espacios. Las estrategias deben adaptarse a cada situación y a sus condiciones.</p>'+
    '<div class="sum">'+
    '<div class="sum-item"><div class="sh"><b>Familia</b></div><p><b>Situación:</b> dos familiares discrepan sobre cómo distribuir el cuidado de una persona mayor. <b>Aplicación:</b> escuchar necesidades, aclarar responsabilidades y acordar turnos realistas.</p></div>'+
    '<div class="sum-item"><div class="sh"><b>Escuela</b></div><p><b>Situación:</b> integrantes de un equipo discuten porque sienten que el trabajo grupal se repartió injustamente. <b>Aplicación:</b> distinguir hechos de suposiciones, escuchar cada versión y definir tareas y fechas verificables.</p></div>'+
    '<div class="sum-item"><div class="sh"><b>Comunidad</b></div><p><b>Situación:</b> vecinos tienen desacuerdos por el uso de un espacio compartido. <b>Aplicación:</b> identificar intereses comunes, establecer reglas claras y fijar una forma de revisar los acuerdos.</p></div></div>'+
    '<div class="feedback" style="margin-top:14px"><h4>Reflexión final</h4><p>¿Qué cambió en el conflicto cuando dejaste de buscar culpables y empezaste a identificar causas, escuchar necesidades y construir acuerdos? ¿Qué harías diferente en una próxima situación?</p></div>'+
    '<div class="cta-row" style="margin-top:22px"><button class="btn primary" id="advanceBtn" data-action="restart">Volver a jugar</button><button class="btn ghost" data-action="glosario">Glosario de métodos</button></div></section>';
  return h;
}

/* ---------- Modales ---------- */
function modalHTML(){
  if(!S.modal){return "";}
  var body="",title="";
  if(S.modal==="restartConfirm"){
    title="¿Reiniciar la partida?";
    body='<p>Se borrarán las decisiones, los indicadores y la bitácora de esta partida. Esta acción no se puede deshacer.</p><div class="cta-row" style="margin-top:18px"><button class="btn primary" data-action="confirmRestart">Sí, reiniciar</button><button class="btn ghost" data-action="closeModal">Seguir jugando</button></div>';
  }else if(S.modal==="glosario"){
    title="Glosario";
    body='<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(S.tab==="metodos")+'" data-action="tab" data-tab="metodos">Cuatro métodos</button><button class="tab" role="tab" aria-selected="'+(S.tab==="conceptos")+'" data-action="tab" data-tab="conceptos">Conceptos clave</button></div>';
    if(S.tab==="metodos"){
      for(var i=0;i<METHODS.length;i++){
        var m=METHODS[i];
        body+='<div class="mcard"><h3>'+m.name+'</h3><p class="def">'+m.def+'</p><dl><dt>Quién decide</dt><dd>'+m.who+'</dd><dt>Cuándo conviene</dt><dd>'+m.when+'</dd><dt>Ventajas</dt><dd>'+m.pro+'</dd><dt>Límites</dt><dd>'+m.con+'</dd><dt>Condiciones</dt><dd>'+m.cond+'</dd></dl></div>';
      }
      body+='<p class="note">Ningún método es siempre superior a los demás. Son conceptos generales con fines educativos; las reglas formales varían según cada contexto y esto no es asesoría legal.</p>';
    }else{
      for(var j=0;j<CONCEPTS.length;j++){body+='<div class="mcard"><h3>'+CONCEPTS[j][0]+'</h3><p class="def" style="margin:0">'+CONCEPTS[j][1]+'</p></div>';}
    }
  }else{
    title="Bitácora de decisiones";
    if(!S.log.length){body='<p>Aún no has tomado decisiones. Aquí verás lo que elegiste y qué consecuencias tuvo.</p>';}
    for(var k=0;k<S.log.length;k++){
      var g=S.log[k];
      body+='<div class="logi"><b>Capítulo '+(g.ch+1)+' · '+g.short+'</b><p>'+g.conseq+'</p><div class="deltas" style="margin-top:6px">'+chipsHTML(g.real)+'</div></div>';
    }
    if(S.stage!=="start"){
      body+='<div style="margin-top:14px"><button class="btn ghost" data-action="restartAsk">'+(S.confirmRestart?"¿Seguro? Pulsa otra vez para reiniciar":"Reiniciar la partida")+'</button></div>';
    }
  }
  return '<div class="overlay" data-action="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="modal-h"><h2>'+title+'</h2><button class="close" data-action="closeModal" aria-label="Cerrar" id="closeBtn">✕</button></div>'+body+'</div></div>';
}
function renderModal(){
  $("#modalRoot").innerHTML=modalHTML();
  if(S.modal){var b=$("#closeBtn");if(b){b.focus({preventScroll:true});}}
}

/* ---------- Render ---------- */
function render(){
  var stage=S.stage,tb=$("#topbar");
  tb.hidden=(stage==="start");
  var html="";
  if(stage==="start"){html=viewStart();}
  else if(stage==="narr"){html=viewNarr();}
  else if(stage==="dlg"){html=viewDlg();}
  else if(stage==="choose"){html=viewChoose();}
  else if(stage==="react"){html=viewReact();}
  else if(stage==="result"){html=viewResult();}
  else{html=viewEnd();}
  $("#stage").innerHTML=html;
  updateChapterInd();
  updateMeters(stage==="result"&&S.picked?S.picked.real:null);
  var key=stage+"|"+S.ch;
  if(key!==lastKey&&stage!=="dlg"&&stage!=="react"){window.scrollTo(0,0);}
  lastKey=(stage==="dlg"||stage==="react")?lastKey:key;
  var f=$("#advanceBtn")||$("#startBtn");
  if(f&&!S.modal){try{f.focus({preventScroll:true});}catch(e){}}
  renderModal();
}

/* ---------- Acciones ---------- */
function applyDelta(d){
  var real=[];
  for(var i=0;i<KEYS.length;i++){
    var k=KEYS[i].k,before=S.stats[k],after=Math.max(0,Math.min(100,before+d[i]));
    S.stats[k]=after;real.push(after-before);
  }
  return real;
}
function choose(i){
  var c=cur(),ch=c.choices[i];
  var fx=ch.fx(S);
  var q=ch.qf?ch.qf(S):ch.q;
  var picked={text:ch.text,short:ch.short,q:q,reaction:ch.reaction(S),conseq:ch.conseq(S),fb:ch.fb(S),real:null};
  picked.real=applyDelta(fx.d);
  fx.fl(S.flags);
  S.picked=picked;
  S.log.push({ch:S.ch,chTitle:c.title,short:ch.short,q:q,conseq:picked.conseq,fb:picked.fb,real:picked.real});
  S.stage="react";S.idx=0;
  render();
}
function advance(){
  if(S.stage==="narr"){S.stage="dlg";S.idx=0;}
  else if(S.stage==="dlg"){if(S.idx<lines().length-1){S.idx++;}else{S.stage="choose";}}
  else if(S.stage==="react"){if(S.idx<S.picked.reaction.length-1){S.idx++;}else{S.stage="result";}}
  render();
}
function nextChapter(){
  if(S.ch<CH.length-1){S.ch++;S.stage="narr";S.idx=0;S.picked=null;}
  else{S.stage="end";S.picked=null;}
  render();
}
function restart(){
  S=fresh();lastKey="";
  S.stage="start";
  render();window.scrollTo(0,0);
}
document.addEventListener("input",function(ev){if(ev.target&&ev.target.id==="playerNameInput"){S.playerNameDraft=ev.target.value;}});
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-action]");
  if(!t){return;}
  var a=t.getAttribute("data-action");
  if(a==="overlay"&&ev.target!==t){return;}
  if(a==="genderPick"){S.playerGender=t.getAttribute("data-gender")==="mujer"?"mujer":"hombre";var inp=$("#playerNameInput");if(inp)S.playerNameDraft=inp.value;render();}
  else if(a==="start"){var inp=$("#playerNameInput");var nm=(inp?inp.value:S.playerNameDraft||"").trim();S.playerNameDraft=nm;S.playerName=nm.slice(0,24)|| (S.playerGender==="mujer"?"Andrea":"Alex");CHAR.alex.name=S.playerName;CHAR.alex.role=S.playerGender==="mujer"?"Coordinadora (tú)":"Coordinador (tú)";S.stage="narr";S.ch=0;render();}
  else if(a==="advance"){advance();}
  else if(a==="choose"){choose(parseInt(t.getAttribute("data-i"),10));}
  else if(a==="next"){nextChapter();}
  else if(a==="restart"){restart();}
  else if(a==="restartAsk"){S.modal="restartConfirm";renderModal();}
  else if(a==="confirmRestart"){S.modal=null;restart();}
  else if(a==="glosario"){S.modal="glosario";S.tab="metodos";renderModal();}
  else if(a==="bitacora"){S.modal="bitacora";S.confirmRestart=false;renderModal();}
  else if(a==="tab"){S.tab=t.getAttribute("data-tab");renderModal();}
  else if(a==="closeModal"||a==="overlay"){S.modal=null;S.confirmRestart=false;renderModal();}
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&S.modal){S.modal=null;S.confirmRestart=false;renderModal();}
});

/* ---------- Arranque ---------- */
function start(data){
  if(data&&data.S){S=data.S;}
  buildMeters();
  render();
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){
  window.claude.hot.snapshot(function(){return {S:S};});
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){window.claude.hot.ready(start);}
else{start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});}
})();
</script>

</body></html>
